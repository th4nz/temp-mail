<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Redz Mail</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          #172033,
          #070b12 55%
        );
      color: #fff;
      font-family:
        Inter,
        Arial,
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .container {
      width: min(1100px, 94%);
      margin: auto;
      padding: 30px 0 60px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .subtitle {
      color: #8f9bad;
      margin-top: 8px;
    }

    .panel {
      background: rgba(17, 24, 39, .82);
      border: 1px solid #263248;
      border-radius: 20px;
      padding: 22px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, .35);
    }

    .controls {
      display: grid;
      grid-template-columns:
        1fr 180px auto;
      gap: 12px;
    }

    input {
      width: 100%;
      border: 1px solid #334155;
      background: #0b111c;
      color: #fff;
      padding: 14px 16px;
      border-radius: 12px;
      outline: none;
    }

    input:focus {
      border-color: #64748b;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 18px;
      cursor: pointer;
      font-weight: 800;
    }

    .primary {
      background: #fff;
      color: #000;
    }

    .secondary {
      background: #202b3d;
      color: #fff;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .status {
      margin-top: 15px;
      color: #9ca9bb;
      font-size: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns:
        340px 1fr;
      gap: 16px;
      margin-top: 18px;
    }

    .list {
      min-height: 400px;
      max-height: 600px;
      overflow: auto;
    }

    .mailbox {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 13px;
      border-bottom: 1px solid #202b3d;
    }

    .mailbox.active {
      background: #182235;
    }

    .mail-info {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .email-address {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 14px;
      font-weight: 700;
    }

    .small {
      color: #7f8da1;
      font-size: 12px;
      margin-top: 4px;
    }

    .copy-btn {
      padding: 8px 10px;
      background: #273449;
      color: #fff;
      font-size: 12px;
    }

    .inbox {
      min-height: 400px;
    }

    .inbox-head {
      padding-bottom: 15px;
      border-bottom: 1px solid #273248;
    }

    .inbox-address {
      font-weight: 900;
      word-break: break-all;
    }

    .message {
      padding: 15px 0;
      border-bottom: 1px solid #202b3d;
      cursor: pointer;
    }

    .message:hover {
      background: rgba(255,255,255,.025);
    }

    .message-subject {
      font-weight: 800;
    }

    .message-from {
      color: #8794a7;
      font-size: 13px;
      margin-top: 5px;
    }

    .message-date {
      color: #68768a;
      font-size: 12px;
      margin-top: 5px;
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 300px;
      color: #718096;
      text-align: center;
      padding: 30px;
    }

    .reader {
      margin-top: 20px;
      border-top: 1px solid #273248;
      padding-top: 20px;
    }

    .reader h2 {
      font-size: 20px;
      margin-bottom: 12px;
    }

    .reader-meta {
      color: #8d99aa;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 15px;
    }

    .body {
      background: #0a101a;
      border: 1px solid #202b3d;
      border-radius: 12px;
      padding: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.6;
      min-height: 100px;
    }

    .error {
      color: #ff8c8c;
    }

    @media (max-width: 800px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header class="header">
    <div class="logo">
      REDZ MAIL
    </div>

    <div class="subtitle">
      Temporary inbox generator
    </div>
  </header>

  <section class="panel">

    <div class="controls">

      <input
        id="count"
        type="number"
        min="1"
        max="100"
        value="5"
        placeholder="Jumlah inbox"
      >

      <button
        id="generate"
        class="primary"
      >
        Generate
      </button>

    </div>

    <div class="toolbar">

      <button
        id="copyAll"
        class="secondary"
      >
        Copy Semua
      </button>

      <button
        id="refresh"
        class="secondary"
      >
        Refresh Inbox
      </button>

    </div>

    <div
      id="status"
      class="status"
    >
      Siap membuat inbox.
    </div>

  </section>

  <section class="layout">

    <div class="panel list">

      <div id="mailboxes">
        <div class="empty">
          Belum ada inbox.
        </div>
      </div>

    </div>

    <div class="panel inbox">

      <div
        id="inboxContent"
        class="empty"
      >
        Pilih inbox untuk melihat email.
      </div>

    </div>

  </section>

</div>

<script>
  const state = {
    mailboxes: [],
    selected: null,
    messages: []
  };

  const countInput =
    document.getElementById("count");

  const generateButton =
    document.getElementById("generate");

  const copyAllButton =
    document.getElementById("copyAll");

  const refreshButton =
    document.getElementById("refresh");

  const statusElement =
    document.getElementById("status");

  const mailboxElement =
    document.getElementById("mailboxes");

  const inboxElement =
    document.getElementById("inboxContent");

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function setStatus(text, error = false) {
    statusElement.textContent = text;

    statusElement.className =
      error
        ? "status error"
        : "status";
  }

  function renderMailboxes() {
    if (!state.mailboxes.length) {
      mailboxElement.innerHTML = `
        <div class="empty">
          Belum ada inbox.
        </div>
      `;

      return;
    }

    mailboxElement.innerHTML =
      state.mailboxes
        .map((mailbox, index) => {

          const active =
            state.selected?.inboxId ===
            mailbox.inboxId;

          return `
            <div
              class="mailbox ${active ? "active" : ""}"
            >

              <div
                class="mail-info"
                onclick="selectInbox(${index})"
              >

                <div class="email-address">
                  ${escapeHtml(mailbox.email)}
                </div>

                <div class="small">
                  Inbox ${index + 1}
                </div>

              </div>

              <button
                class="copy-btn"
                onclick="copyEmail(${index})"
              >
                COPY
              </button>

            </div>
          `;
        })
        .join("");
  }

  async function generateInboxes() {
    const count =
      Number(countInput.value);

    if (
      !Number.isInteger(count) ||
      count < 1 ||
      count > 100
    ) {
      setStatus(
        "Jumlah harus 1 sampai 100.",
        true
      );

      return;
    }

    generateButton.disabled = true;

    setStatus(
      `Membuat ${count} inbox...`
    );

    try {
      const response =
        await fetch("/api/inboxes", {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            count
          })
        });

      const data =
        await response.json();

      if (!response.ok || !data.success) {
        throw new Error(
          data.error ||
          "Gagal membuat inbox"
        );
      }

      state.mailboxes =
        data.inboxes || [];

      state.selected = null;
      state.messages = [];

      renderMailboxes();

      inboxElement.innerHTML = `
        <div class="empty">
          Pilih inbox untuk melihat email.
        </div>
      `;

      setStatus(
        `${state.mailboxes.length} inbox berhasil dibuat.`
      );

    } catch (error) {
      console.error(error);

      setStatus(
        error.message ||
        "Terjadi kesalahan.",
        true
      );

    } finally {
      generateButton.disabled = false;
    }
  }

  async function selectInbox(index) {
    const mailbox =
      state.mailboxes[index];

    if (!mailbox) {
      return;
    }

    state.selected = mailbox;

    renderMailboxes();

    inboxElement.innerHTML = `
      <div class="empty">
        Memuat inbox...
      </div>
    `;

    await loadEmails();
  }

  async function loadEmails() {
    if (!state.selected) {
      return;
    }

    try {
      const url =
        `/api/emails?inboxId=${encodeURIComponent(
          state.selected.inboxId
        )}&page=0&size=20`;

      const response =
        await fetch(url);

      const data =
        await response.json();

      if (!response.ok || !data.success) {
        throw new Error(
          data.error ||
          "Gagal mengambil email"
        );
      }

      state.messages =
        data.emails || [];

      renderInbox();

      setStatus(
        `${state.messages.length} email ditemukan.`
      );

    } catch (error) {
      console.error(error);

      inboxElement.innerHTML = `
        <div class="empty error">
          ${escapeHtml(
            error.message ||
            "Gagal mengambil inbox."
          )}
        </div>
      `;
    }
  }

  function renderInbox() {
    const mailbox =
      state.selected;

    if (!mailbox) {
      return;
    }

    if (!state.messages.length) {
      inboxElement.innerHTML = `
        <div class="inbox-head">
          <div class="inbox-address">
            ${escapeHtml(mailbox.email)}
          </div>
        </div>

        <div class="empty">
          Belum ada email masuk.
        </div>
      `;

      return;
    }

    inboxElement.innerHTML = `

      <div class="inbox-head">

        <div class="inbox-address">
          ${escapeHtml(mailbox.email)}
        </div>

      </div>

      <div id="messages">

        ${state.messages
          .map((message, index) => {

            const subject =
              message.subject ||
              "(Tanpa subject)";

            const sender =
              message.from ||
              message.sender ||
              "Unknown";

            const date =
              message.createdAt ||
              message.receivedAt ||
              "";

            return `
              <div
                class="message"
                onclick="openEmail(${index})"
              >

                <div class="message-subject">
                  ${escapeHtml(subject)}
                </div>

                <div class="message-from">
                  From:
                  ${escapeHtml(sender)}
                </div>

                <div class="message-date">
                  ${escapeHtml(date)}
                </div>

              </div>
            `;
          })
          .join("")}

      </div>

      <div id="reader"></div>
    `;
  }

  async function openEmail(index) {
    const message =
      state.messages[index];

    if (!message) {
      return;
    }

    const emailId =
      message.id;

    const reader =
      document.getElementById(
        "reader"
      );

    if (!reader) {
      return;
    }

    reader.innerHTML = `
      <div class="empty">
        Membuka email...
      </div>
    `;

    try {
      const response =
        await fetch(
          `/api/email?emailId=${encodeURIComponent(
            emailId
          )}`
        );

      const data =
        await response.json();

      if (!response.ok || !data.success) {
        throw new Error(
          data.error ||
          "Gagal membuka email"
        );
      }

      const email =
        data.email;

      const body =
        email.body ||
        email.bodyExcerpt ||
        email.textBody ||
        "(Email kosong)";

      reader.innerHTML = `

        <div class="reader">

          <h2>
            ${escapeHtml(
              email.subject ||
              "(Tanpa subject)"
            )}
          </h2>

          <div class="reader-meta">

            <div>
              From:
              ${escapeHtml(
                email.from || ""
              )}
            </div>

            <div>
              To:
              ${escapeHtml(
                Array.isArray(email.to)
                  ? email.to.join(", ")
                  : email.to || ""
              )}
            </div>

            <div>
              Date:
              ${escapeHtml(
                email.createdAt ||
                email.receivedAt ||
                ""
              )}
            </div>

          </div>

          <div class="body">
            ${escapeHtml(body)}
          </div>

        </div>

      `;

    } catch (error) {
      reader.innerHTML = `
        <div class="empty error">
          ${escapeHtml(
            error.message ||
            "Gagal membuka email."
          )}
        </div>
      `;
    }
  }

  async function copyEmail(index) {
    const mailbox =
      state.mailboxes[index];

    if (!mailbox) {
      return;
    }

    await navigator.clipboard.writeText(
      mailbox.email
    );

    setStatus(
      `${mailbox.email} berhasil dicopy.`
    );
  }

  async function copyAll() {
    if (!state.mailboxes.length) {
      setStatus(
        "Belum ada email.",
        true
      );

      return;
    }

    const text =
      state.mailboxes
        .map(item => item.email)
        .join("\n");

    await navigator.clipboard.writeText(
      text
    );

    setStatus(
      `${state.mailboxes.length} email berhasil dicopy.`
    );
  }

  generateButton.addEventListener(
    "click",
    generateInboxes
  );

  copyAllButton.addEventListener(
    "click",
    copyAll
  );

  refreshButton.addEventListener(
    "click",
    loadEmails
  );

  window.selectInbox =
    selectInbox;

  window.copyEmail =
    copyEmail;

  window.openEmail =
    openEmail;
</script>

</body>
</html>
